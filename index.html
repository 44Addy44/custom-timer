<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Timer</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
    transition: 0.25s;
}

body.dark {
    background: #181818;
    color: #f5f5f5;
}

.container {
    max-width: 650px;
    margin: 40px auto;
    padding: 25px;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

h1 {
    margin: 0;
}

.theme {
    border: none;
    border-radius: 10px;
    padding: 10px 14px;
    cursor: pointer;
    background: #e0e0e0;
}

.dark .theme {
    background: #333;
    color: white;
}

.timer-box {
    background: white;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    text-align: center;
}

.dark .timer-box {
    background: #242424;
}

.display {
    font-size: clamp(55px, 13vw, 100px);
    font-weight: bold;
    margin: 10px 0 25px;
    font-variant-numeric: tabular-nums;
}

.inputs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.inputs label {
    display: block;
    font-size: 14px;
    margin-bottom: 5px;
}

.inputs input {
    width: 100%;
    padding: 12px;
    font-size: 18px;
    border: 1px solid #ccc;
    border-radius: 10px;
    text-align: center;
    background: inherit;
    color: inherit;
}

.buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 20px;
}

button {
    padding: 11px 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
}

.start {
    background: #222;
    color: white;
}

.dark .start {
    background: white;
    color: #222;
}

.status {
    margin-top: 15px;
    opacity: 0.7;
}

.saved {
    margin-top: 25px;
    text-align: left;
}

.saved h2 {
    font-size: 20px;
}

.saved-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.saved-item {
    display: flex;
    align-items: center;
    gap: 5px;
}

.saved-item button {
    background: #e9e9e9;
}

.dark .saved-item button {
    background: #333;
    color: white;
}

.delete {
    padding: 8px 10px !important;
}

.save-area {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

.save-area input {
    flex: 1;
    padding: 11px;
    border: 1px solid #ccc;
    border-radius: 10px;
    background: inherit;
    color: inherit;
}

.save-area button {
    background: #ddd;
}

.dark .save-area button {
    background: #444;
    color: white;
}

@media (max-width: 500px) {
    .container {
        margin: 15px auto;
        padding: 12px;
    }

    .timer-box {
        padding: 20px 15px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="top">
        <h1>⏱️ My Timer</h1>
        <button class="theme" id="themeBtn">🌙 Dark</button>
    </div>

    <div class="timer-box">

        <div class="display" id="display">00:10:00</div>

        <div class="inputs">
            <div>
                <label>Hours</label>
                <input id="hours" type="number" min="0" max="99" value="0">
            </div>

            <div>
                <label>Minutes</label>
                <input id="minutes" type="number" min="0" max="59" value="10">
            </div>

            <div>
                <label>Seconds</label>
                <input id="seconds" type="number" min="0" max="59" value="0">
            </div>
        </div>

        <div class="buttons">
            <button class="start" id="start">▶ Start</button>
            <button id="pause">⏸ Pause</button>
            <button id="reset">↻ Reset</button>
        </div>

        <div class="status" id="status">Ready</div>

        <div class="saved">
            <h2>⭐ Saved Timers</h2>

            <div class="saved-list" id="savedList"></div>

            <div class="save-area">
                <input id="timerName" type="text"
                       placeholder="Name this timer (e.g. Study 10 min)">
                <button id="save">💾 Save</button>
            </div>
        </div>

    </div>
</div>


<script>

let totalSeconds = 600;
let running = false;
let endTime = null;
let interval = null;


/* ---------- ELEMENTS ---------- */

const display = document.getElementById("display");
const hours = document.getElementById("hours");
const minutes = document.getElementById("minutes");
const seconds = document.getElementById("seconds");
const status = document.getElementById("status");
const savedList = document.getElementById("savedList");


/* ---------- TIMER ---------- */

function getInputSeconds() {

    let h = Math.max(0, Number(hours.value) || 0);
    let m = Math.max(0, Math.min(59, Number(minutes.value) || 0));
    let s = Math.max(0, Math.min(59, Number(seconds.value) || 0));

    return h * 3600 + m * 60 + s;
}


function formatTime(total) {

    total = Math.max(0, Math.ceil(total));

    let h = Math.floor(total / 3600);
    let m = Math.floor((total % 3600) / 60);
    let s = total % 60;

    return String(h).padStart(2, "0") + ":" +
           String(m).padStart(2, "0") + ":" +
           String(s).padStart(2, "0");
}


function updateDisplay() {
    display.textContent = formatTime(totalSeconds);
}


function startTimer() {

    if (running) return;

    if (totalSeconds <= 0) {
        totalSeconds = getInputSeconds();
    }

    if (totalSeconds <= 0) {
        status.textContent = "Set a time first!";
        return;
    }

    running = true;
    status.textContent = "Running...";

    endTime = Date.now() + totalSeconds * 1000;

    interval = setInterval(() => {

        totalSeconds = Math.max(
            0,
            (endTime - Date.now()) / 1000
        );

        updateDisplay();

        if (totalSeconds <= 0) {
            finishTimer();
        }

    }, 100);
}


function pauseTimer() {

    if (!running) return;

    running = false;
    clearInterval(interval);

    totalSeconds = Math.max(
        0,
        (endTime - Date.now()) / 1000
    );

    status.textContent = "Paused";
    updateDisplay();
}


function resetTimer() {

    running = false;
    clearInterval(interval);

    totalSeconds = getInputSeconds();

    status.textContent = "Ready";
    updateDisplay();
}


function finishTimer() {

    running = false;
    clearInterval(interval);

    totalSeconds = 0;

    updateDisplay();

    status.textContent = "⏰ Time's up!";

    beep();
}


/* ---------- SOUND ---------- */

function beep() {

    try {

        const audio =
            new (window.AudioContext ||
                 window.webkitAudioContext)();

        const oscillator =
            audio.createOscillator();

        const gain =
            audio.createGain();

        oscillator.connect(gain);
        gain.connect(audio.destination);

        oscillator.frequency.value = 800;
        oscillator.type = "sine";

        gain.gain.setValueAtTime(
            0.3,
            audio.currentTime
        );

        oscillator.start();

        oscillator.stop(
            audio.currentTime + 0.6
        );

    } catch (e) {
        console.log("Sound unavailable");
    }
}


/* ---------- INPUTS ---------- */

[hours, minutes, seconds].forEach(input => {

    input.addEventListener("input", () => {

        if (!running) {

            totalSeconds = getInputSeconds();

            updateDisplay();

        }

    });

});


/* ---------- BUTTONS ---------- */

document.getElementById("start")
    .addEventListener("click", startTimer);

document.getElementById("pause")
    .addEventListener("click", pauseTimer);

document.getElementById("reset")
    .addEventListener("click", resetTimer);


/* ---------- SAVED TIMERS ---------- */

function getSavedTimers() {

    return JSON.parse(
        localStorage.getItem("myTimers") || "[]"
    );

}


function saveTimer() {

    let name =
        document.getElementById("timerName")
        .value.trim();

    if (!name) {
        name = formatTime(getInputSeconds());
    }

    let time = getInputSeconds();

    if (time <= 0) {
        alert("Set a timer first!");
        return;
    }

    let timers = getSavedTimers();

    timers.push({
        name: name,
        seconds: time
    });

    localStorage.setItem(
        "myTimers",
        JSON.stringify(timers)
    );

    document.getElementById("timerName").value = "";

    renderSavedTimers();
}


function loadTimer(time) {

    totalSeconds = time;

    hours.value =
        Math.floor(time / 3600);

    minutes.value =
        Math.floor((time % 3600) / 60);

    seconds.value =
        time % 60;

    running = false;
    clearInterval(interval);

    status.textContent = "Loaded";
    updateDisplay();
}


function deleteTimer(index) {

    let timers = getSavedTimers();

    timers.splice(index, 1);

    localStorage.setItem(
        "myTimers",
        JSON.stringify(timers)
    );

    renderSavedTimers();
}


function renderSavedTimers() {

    savedList.innerHTML = "";

    let timers = getSavedTimers();

    if (timers.length === 0) {

        savedList.innerHTML =
            "<span style='opacity:.6'>No saved timers yet.</span>";

        return;
    }

    timers.forEach((timer, index) => {

        let wrapper =
            document.createElement("div");

        wrapper.className = "saved-item";

        let button =
            document.createElement("button");

        button.textContent =
            timer.name;

        button.addEventListener(
            "click",
            () => loadTimer(timer.seconds)
        );

        let deleteButton =
            document.createElement("button");

        deleteButton.textContent = "×";

        deleteButton.className = "delete";

        deleteButton.addEventListener(
            "click",
            () => deleteTimer(index)
        );

        wrapper.appendChild(button);
        wrapper.appendChild(deleteButton);

        savedList.appendChild(wrapper);

    });

}


document.getElementById("save")
    .addEventListener("click", saveTimer);


/* ---------- DARK MODE ---------- */

function applyTheme() {

    let dark =
        localStorage.getItem("darkMode") === "true";

    document.body.classList.toggle(
        "dark",
        dark
    );

    document.getElementById("themeBtn")
        .textContent =
        dark ? "☀️ Light" : "🌙 Dark";
}


document.getElementById("themeBtn")
    .addEventListener("click", () => {

        let dark =
            !document.body.classList.contains("dark");

        document.body.classList.toggle(
            "dark",
            dark
        );

        localStorage.setItem(
            "darkMode",
            dark
        );

        applyTheme();

    });


/* ---------- INITIALIZE ---------- */

applyTheme();
renderSavedTimers();
updateDisplay();

</script>

</body>
</html>
